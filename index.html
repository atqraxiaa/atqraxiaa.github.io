<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@nyxiariah · bio!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#a855f7;
    --accent2:#38bdf8;
    --bg:#07060b;
    --card:rgba(255,255,255,.04);
    --line:rgba(255,255,255,.09);
    --text:#f4f2fa;
    --muted:#9a96ab;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:Inter,system-ui,sans-serif;
    background:var(--bg);color:var(--text);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;object-fit:cover;background:#2c4357}
  .vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse at center,transparent 40%,rgba(8,18,30,.5) 100%)}

  body.entered{--accent:#e6c9a8;--accent2:#ff9a6b;--text:#f6f1ec;--muted:#cbbfb4;--card:rgba(38,32,30,.55);--line:rgba(255,235,215,.22)}
  body.entered .bio{color:#efe6dd}
  body.entered h1{text-shadow:0 2px 18px rgba(20,40,60,.6)}
  body.entered footer{color:#a9bccb}

  #splash{
    position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    background:var(--bg);cursor:pointer;
    transition:opacity .8s ease, visibility .8s;
  }
  #splash.hide{opacity:0;visibility:hidden}
  #splash span{
    font-family:"Space Grotesk",sans-serif;font-size:1.05rem;letter-spacing:.35em;text-transform:uppercase;
    color:var(--muted);animation:pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}

  main{
    position:relative;z-index:2;height:100%;
    display:flex;align-items:center;justify-content:center;padding:20px;
    perspective:900px;
  }
  .card{
    width:min(420px,100%);
    padding:34px 28px 26px;
    border-radius:22px;
    background:var(--card);
    border:1px solid var(--line);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    box-shadow:0 30px 80px -20px rgba(0,0,0,.8), 0 0 60px -20px var(--accent);
    text-align:center;
    transform-style:preserve-3d;
    opacity:0;transform:translateY(24px) scale(.97);
    transition:opacity .9s ease .2s, transform .9s ease .2s;
  }
  body.entered .card{opacity:1;transform:none}
  .card.tilting{transition:none}

  .avatar{
    width:104px;height:104px;margin:0 auto 16px;border-radius:50%;
    padding:3px;background:conic-gradient(from 0deg,var(--accent),var(--accent2),var(--accent));
    animation:spin 6s linear infinite;
  }
  .avatar > div{
    width:100%;height:100%;border-radius:50%;background:#0d0b14;
    display:flex;align-items:center;justify-content:center;
    font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:2.4rem;
    animation:spin 6s linear infinite reverse;
    overflow:hidden;
  }
  .avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
  @keyframes spin{to{transform:rotate(360deg)}}

  h1{
    font-family:"Space Grotesk",sans-serif;font-size:1.9rem;font-weight:700;letter-spacing:-.01em;
    display:inline-flex;align-items:center;gap:8px;
    text-shadow:0 0 24px color-mix(in srgb,var(--accent) 70%,transparent);
  }
  .badge{width:20px;height:20px;color:var(--accent2)}
  .tag{color:var(--muted);font-size:.85rem;margin-top:2px}
  .bio{
    margin-top:14px;min-height:1.5em;font-size:.98rem;color:#d6d2e4;
  }
  .bio::after{content:"▍";margin-left:2px;color:var(--accent);animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  .meta{
    display:flex;justify-content:center;gap:18px;margin-top:14px;
    font-size:.8rem;color:var(--muted);
  }
  .meta span{display:inline-flex;align-items:center;gap:6px}
  .meta svg{width:14px;height:14px}

  .socials{display:flex;justify-content:center;gap:10px;margin:22px 0 6px;flex-wrap:wrap}
  .socials a{
    width:46px;height:46px;border-radius:14px;display:grid;place-items:center;
    background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--text);
    transition:transform .2s, background .2s, box-shadow .2s, border-color .2s;
  }
  .socials a:hover{
    transform:translateY(-4px);background:rgba(255,255,255,.1);
    border-color:var(--accent);box-shadow:0 8px 24px -8px var(--accent);
  }
  .socials svg{width:21px;height:21px;fill:currentColor}

  .links{display:grid;gap:10px;margin-top:16px}
  .links a{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;border-radius:14px;text-decoration:none;color:var(--text);
    background:rgba(255,255,255,.04);border:1px solid var(--line);font-weight:500;font-size:.95rem;
    transition:transform .2s, border-color .2s, background .2s;
  }
  .links a:hover{transform:scale(1.02);border-color:var(--accent);background:rgba(255,255,255,.08)}
  .links a small{color:var(--muted);font-weight:400}

  .about-btn{
    width:100%;display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;border-radius:14px;color:var(--text);font:inherit;font-weight:500;font-size:.95rem;
    background:rgba(255,255,255,.04);border:1px solid var(--line);cursor:pointer;
    transition:transform .2s, border-color .2s, background .2s;
  }
  .about-btn:hover{border-color:var(--accent);background:rgba(255,255,255,.08)}
  .about-btn .chev{color:var(--muted);transition:transform .3s}
  .about.open .chev{transform:rotate(180deg)}
  .about-panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
  .about.open .about-panel{grid-template-rows:1fr}
  .about-inner{overflow:hidden}
  .about-inner p{
    margin-top:8px;padding:12px 14px;border-radius:12px;text-align:left;
    font-size:.88rem;line-height:1.55;color:#e3eef7;
    background:rgba(255,255,255,.05);border:1px solid var(--line);
  }
  .about-inner p:first-child{margin-top:10px}

  footer{margin-top:20px;font-size:.72rem;color:#6d6980}

  @media (max-width:520px){
    main{padding:14px}
    .card{width:min(300px,100%);padding:22px 16px 18px;border-radius:18px}
    .avatar{width:80px;height:80px;margin-bottom:12px}
    h1{font-size:1.45rem}
    .tag{font-size:.78rem}
    .bio{font-size:.86rem;margin-top:10px}
    .meta{margin-top:10px;font-size:.74rem}
    .socials{margin:16px 0 4px;gap:8px}
    .socials a{width:38px;height:38px;border-radius:12px}
    .socials svg{width:17px;height:17px}
    .links{margin-top:12px}
    .links a,.about-btn{padding:11px 14px;font-size:.88rem}
    .about-inner p{font-size:.82rem;padding:10px 12px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<video id="bg" src="bg.mp4" autoplay muted loop playsinline preload="auto"></video>
<div class="vignette"></div>

<div id="splash"><span>click to enter...</span></div>

<main>
  <section class="card" id="card">
    <div class="avatar"><div id="avatar"><img src="profile.png"></div></div>

    <h1>
      Nyxia
      <svg class="badge" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1l2.6 2.1 3.3-.2 1.2 3.1 2.9 1.6-.8 3.2 1.4 3-2.5 2.2-.4 3.3-3.3.6L12 23l-2.4-2.1-3.3-.6-.4-3.3L3.4 14.8l1.4-3-.8-3.2 2.9-1.6 1.2-3.1 3.3.2L12 1zm-1.2 14.4l5.2-5.2-1.4-1.4-3.8 3.8-1.8-1.8-1.4 1.4 3.2 3.2z"/></svg>
    </h1>
    <div class="tag">@nyxiariah</div>

    <p class="bio" id="bio"></p>

    <div class="meta">
      <span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
        <b id="views">0</b>
      </span>
      <span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
        Philippines
      </span>
    </div>

    <div class="socials">
      <a href="#" aria-label="Discord" title="Discord"><svg viewBox="0 0 24 24"><path d="M20.3 4.4A17 17 0 0016 3l-.2.4a15 15 0 013.7 1.8 14 14 0 00-15 0A15 15 0 018.2 3.4L8 3a17 17 0 00-4.3 1.4C1 8.6.3 12.6.6 16.5a17 17 0 005.2 2.6l1.1-1.800a11 11 0 01-1.700-.8l.4-.3a12 12 0 0010.800 0l.4.3c-.5.3-1.100.6-1.700.8l1.100 1.800a17 17 0 005.200-2.600c.4-4.500-.7-8.500-3.100-12.100zM8.500 14.200c-1 0-1.800-.9-1.800-2s.8-2 1.800-2 1.800.9 1.800 2-.8 2-1.800 2zm7 0c-1 0-1.800-.9-1.800-2s.8-2 1.800-2 1.800.9 1.800 2-.8 2-1.800 2z"/></svg></a>
      <a href="#" aria-label="Instagram" title="Instagram"><svg viewBox="0 0 24 24"><path d="M12 7.400a4.600 4.600 0 100 9.200 4.600 4.600 0 000-9.200zm0 7.600a3 3 0 110-6 3 3 0 010 6zm4.800-7.800a1.100 1.100 0 100 2.200 1.100 1.100 0 000-2.200zM12 2.200c-2.700 0-3 0-4.100.1-3 .1-4.500 1.700-4.600 4.600C3.200 8 3.200 8.300 3.200 11v2c0 2.700 0 3 .1 4.100.1 3 1.700 4.500 4.600 4.600 1.100.1 1.400.1 4.100.1s3 0 4.100-.1c3-.1 4.500-1.700 4.600-4.600.1-1.100.1-1.400.1-4.100v-2c0-2.700 0-3-.1-4.100-.1-3-1.700-4.500-4.600-4.600C15 2.200 14.700 2.200 12 2.200zm0 1.800c2.600 0 3 0 4 .1 2.400.1 3.500 1.200 3.600 3.600.1 1 .1 1.400.1 3.900v1c0 2.500 0 2.900-.1 3.900-.1 2.400-1.200 3.500-3.600 3.600-1 .1-1.400.1-4 .1s-3 0-4-.1c-2.400-.1-3.500-1.200-3.600-3.600C4.300 15.900 4.300 15.500 4.300 13v-1c0-2.500 0-2.900.1-3.900.1-2.400 1.200-3.500 3.600-3.600C9 4 9.400 4 12 4z"/></svg></a>
      <a href="#" aria-label="TikTok" title="TikTok"><svg viewBox="0 0 24 24"><path d="M16.600 2h-3.200v13.400a2.800 2.800 0 11-2.800-2.800c.3 0 .5 0 .8.100V9.400a6 6 0 105.200 6V8.700a7.300 7.300 0 004.200 1.300V6.800A4.300 4.300 0 0116.600 2z"/></svg></a>
      <a href="#" aria-label="YouTube" title="YouTube"><svg viewBox="0 0 24 24"><path d="M23 7.200a3 3 0 00-2.100-2.100C19 4.600 12 4.600 12 4.600s-7 0-8.900.5A3 3 0 001 7.200 31 31 0 00.5 12 31 31 0 001 16.800a3 3 0 002.100 2.100c1.900.5 8.900.5 8.900.5s7 0 8.900-.5a3 3 0 002.100-2.100c.4-1.600.5-3.200.5-4.800s-.1-3.200-.5-4.800zM9.700 15V9l5.800 3-5.800 3z"/></svg></a>
      <a href="#" aria-label="GitHub" title="GitHub"><svg viewBox="0 0 24 24"><path d="M12 .5a11.500 11.500 0 00-3.600 22.400c.6.100.8-.2.8-.6v-2c-3.200.7-3.900-1.500-3.900-1.500-.5-1.300-1.300-1.700-1.300-1.700-1-.7.100-.7.100-.7 1.200.1 1.800 1.200 1.800 1.200 1 1.800 2.700 1.300 3.400 1 .1-.8.4-1.300.7-1.600-2.600-.3-5.300-1.300-5.300-5.700 0-1.300.5-2.300 1.200-3.100-.1-.3-.5-1.500.1-3.100 0 0 1-.3 3.200 1.200a11 11 0 015.800 0c2.200-1.500 3.200-1.200 3.200-1.200.6 1.600.2 2.800.1 3.100.8.800 1.200 1.800 1.200 3.100 0 4.400-2.700 5.400-5.300 5.700.4.400.8 1.100.8 2.200v3.200c0 .4.200.7.800.6A11.500 11.500 0 0012 .5z"/></svg></a>
    </div>

    <div class="links">
      <div class="about" id="about">
        <button type="button" class="about-btn" id="aboutBtn" aria-expanded="false" aria-controls="aboutPanel">
          About Me <small class="chev">▾</small>
        </button>
        <div class="about-panel" id="aboutPanel">
          <div class="about-inner">
            <p>Write anything about yourself here. Edit this text in index.html.</p>
            <p>You can add more paragraphs, hobbies, or favorites too.</p>
          </div>
        </div>
      </div>
    </div>

  </section>
</main>

<script>

const CONFIG = {
  bioLines: ["just a random user on the internet.", "welcome to my website! ✦"],
  accent:  "#9fd3f5",
  accent2: "#ff9a6b"
};

document.documentElement.style.setProperty('--accent', CONFIG.accent);
document.documentElement.style.setProperty('--accent2', CONFIG.accent2);

const vid = document.getElementById('bg');
vid.muted = true;
vid.play().catch(()=>{});

const bioEl = document.getElementById('bio');
async function typeLoop(){
  let i = 0;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  while (true){
    const line = CONFIG.bioLines[i % CONFIG.bioLines.length];
    for (let c = 1; c <= line.length; c++){ bioEl.textContent = line.slice(0,c); await sleep(55); }
    await sleep(1800);
    for (let c = line.length; c >= 0; c--){ bioEl.textContent = line.slice(0,c); await sleep(25); }
    await sleep(300); i++;
  }
}

async function bumpViews(){
  const el = document.getElementById('views');
  const KEY = 'nyxiariah-bio-q7k2m9x4';
  let n = 0;
  try {
    const r = await fetch('https://countapi.mileshilliard.com/api/v1/hit/' + KEY);
    const d = await r.json();
    n = parseInt(d.value, 10) || 0;
  } catch (e) {}
  if (!n) {
    try { n = parseInt(localStorage.getItem('views')||'0',10) + 1; localStorage.setItem('views', n); }
    catch (e) { n = 1; }
  }
  let cur = 0; const step = Math.max(1, Math.ceil(n/30));
  const iv = setInterval(() => { cur = Math.min(n, cur+step); el.textContent = cur.toLocaleString(); if (cur>=n) clearInterval(iv) }, 30);
}

document.getElementById('aboutBtn').addEventListener('click', () => {
  const box = document.getElementById('about');
  const open = box.classList.toggle('open');
  document.getElementById('aboutBtn').setAttribute('aria-expanded', open);
});

let entered = false;
function enter(){
  if (entered) return; entered = true;
  document.getElementById('splash').classList.add('hide');
  document.body.classList.add('entered');
  vid.play().catch(()=>{});
  typeLoop(); bumpViews();
}
document.getElementById('splash').addEventListener('click', enter);
addEventListener('keydown', enter);

const card = document.getElementById('card');
if (matchMedia('(hover:hover)').matches){
  addEventListener('mousemove', e => {
    if (!entered) return;
    const x = (e.clientX / innerWidth - .5), y = (e.clientY / innerHeight - .5);
    card.classList.add('tilting');
    card.style.transform = `rotateY(${x*10}deg) rotateX(${-y*10}deg)`;
  });
  addEventListener('mouseleave', () => { card.classList.remove('tilting'); card.style.transform = ''; });
}
</script>
</body>
</html>
